<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; background: #eef1f6; color: #333;
  }
  /* 顶部导航：固定在外层，页签始终可见，方便随时切换 */
  .jb-bar {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 0;
    width: 100%;
    background: linear-gradient(135deg, #0b3d91 0%, #1890ff 100%);
    padding: 0 18px; height: 58px; flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); z-index: 10;
  }
  /* 顶部「对比另一款」快捷按钮 */
  .jb-guide {
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    margin-left: 12px; padding: 7px 14px; border: 1px solid rgba(255,255,255,.55);
    border-radius: 999px; background: rgba(255,255,255,.14); color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    white-space: nowrap; transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .jb-guide:hover { background: rgba(255,255,255,.3); border-color: #fff; }
  .jb-guide:active { transform: scale(.95); }
  /* 分段控件式页签（iOS Segmented Control 风格，带滑动高亮块） */
  .jb-tabs {
    position: relative; display: flex;
    background: rgba(255,255,255,.16); border-radius: 999px;
    padding: 4px; margin: 0 auto; width: min(680px, 100%);
  }
  .jb-indicator {
    position: absolute; z-index: 1; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 8px) / 3);
    background: linear-gradient(180deg, #ffffff 0%, #eaf3ff 100%);
    border-radius: 999px;
    box-shadow: 0 3px 12px rgba(11,61,145,.55), inset 0 -2px 4px rgba(11,61,145,.08);
    transform: translateX(0%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .jb-tab {
    position: relative; z-index: 2; flex: 1; border: none; cursor: pointer;
    background: transparent; color: rgba(255,255,255,.65); font-family: inherit;
    font-size: 15px; font-weight: 600; padding: 9px 8px; border-radius: 999px;
    transition: color .25s ease, transform .15s ease; white-space: nowrap; text-align: center;
  }
  .jb-tab:hover { color: #fff; }
  .jb-tab:active { transform: scale(.95); }
  .jb-tab.active { color: #0b3d91; font-weight: 800; text-shadow: none; }
  /* 内容区：外层不滚动，每个子页各自独立滚动（移动端地址栏收放时不会跳动） */
  .jb-stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
  .jb-frame {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; background: #fff; display: none;
  }
  .jb-frame.active { display: block; animation: jbFade .28s ease; }
  @keyframes jbFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 「点我看区别」页签轻呼吸提示，引导客户先看差异（点击后自动停止） */
  .jb-tab.hint { color: #fff; font-weight: 700; }
  .jb-tab.hint::after {
    content: ''; position: absolute; inset: 0; border-radius: 999px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.75);
    animation: jbPulse 1.9s ease-out infinite; pointer-events: none;
  }
  @keyframes jbPulse {
    0% { opacity: .9; transform: scale(.94); }
    70% { opacity: 0; transform: scale(1.06); }
    100% { opacity: 0; transform: scale(1.06); }
  }
  @media (max-width: 1080px) {
    .jb-guide-ar { display: none; }
    .jb-guide { padding: 6px 11px; margin-left: 10px; font-size: 12.5px; }
  }
  /* 平板 / 手机：页签占满宽度，快捷按钮缩小为小胶囊，避免挤压页签文字 */
  @media (max-width: 760px) {
    .jb-bar { height: 54px; padding: 0 10px; }
    .jb-tabs { width: 100%; }
    .jb-tab { font-size: 14px; padding: 9px 2px; letter-spacing: -.2px; }
    .jb-guide {
      margin-left: 8px; padding: 5px 9px; font-size: 12px; gap: 1px;
      border-color: rgba(255,255,255,.7); background: rgba(255,255,255,.22);
    }
    .jb-guide-ar { font-size: 12px; }
  }
  @media (max-width: 400px) {
    .jb-bar { height: 50px; padding: 0 8px; }
    .jb-tabs { padding: 3px; }
    .jb-tab { font-size: 12.5px; padding: 8px 2px; }
    .jb-guide { margin-left: 6px; padding: 5px 7px; font-size: 11.5px; }
  }

<script>
/**
 * 报价单「复制为图片」通用实现（Canvas 手绘，无外部依赖）
 * 用法：QuoteShot.copy({ title, blocks, filename, onTip })
 * blocks: {type:'text', text, size, weight, color, lh, strike} | {type:'hr'} | {type:'gap', h}
 */
(function () {
  var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif';

function wrap(ctx, text, maxW) {
    var lines = [];
    String(text).split('\n').forEach(function (raw) {
      if (raw === '') { lines.push(''); return; }
      var cur = '';
      for (var i = 0; i < raw.length; i++) {
        var ch = raw[i];
        if (ctx.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; }
        else { cur += ch; }
      }
      lines.push(cur);
    });
    return lines;
  }

  function draw(opts) {
    var W = opts.width || 750;
    var PAD = 56;
    var innerW = W - PAD * 2;
    var measure = document.createElement('canvas').getContext('2d');
    var rows = [];
    var title = opts.title || '';
    var blocks = opts.blocks || [];

    measure.font = '800 40px ' + FONT;
    var titleLines = wrap(measure, title || ' ', innerW);
    var titleLH = 56;

    blocks.forEach(function (b) {
      if (b.type === 'hr') { rows.push({ type: 'hr' }); return; }
      if (b.type === 'gap') { rows.push({ type: 'gap', h: b.h || 0 }); return; }
      var size = b.size || 29;
      var weight = b.weight || '400';
      var lh = b.lh || Math.round(size * 1.8);
      measure.font = weight + ' ' + size + 'px ' + FONT;
      wrap(measure, b.text, innerW).forEach(function (ln) {
        rows.push({ type: 'text', text: ln, size: size, weight: weight, color: b.color || '#333333', lh: lh, strike: !!b.strike });
      });
    });

    var H = PAD + 10;
    H += titleLines.length * titleLH + 14;
    rows.forEach(function (l) {
      if (l.type === 'hr') H += 2 + 30;
      else if (l.type === 'gap') H += l.h;
      else H += l.lh;
    });
    H += PAD;

    var scale = 2;
    var c = document.createElement('canvas');
    c.width = W * scale;
    c.height = H * scale;
    var ctx = c.getContext('2d');
    ctx.scale(scale, scale);
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    var y = PAD + 10;
    ctx.fillStyle = opts.titleColor || '#1B3A5B';
    ctx.font = '800 40px ' + FONT;
    titleLines.forEach(function (ln) {
      ctx.fillText(ln, PAD, y + 40);
      y += titleLH;
    });

    y += 14;
    ctx.fillRect(PAD, y, 240, 3);
    y += 12;

    rows.forEach(function (l) {
      if (l.type === 'hr') {
        ctx.fillStyle = opts.hrColor || '#1B3A5B';
        ctx.fillRect(PAD, y + 12, 240, 3);
        y += 3 + 26;
        return;
      }
      if (l.type === 'gap') { y += l.h; return; }
      ctx.fillStyle = l.color;
      ctx.font = l.weight + ' ' + l.size + 'px ' + FONT;
      var baseY = y + l.lh / 2 + l.size * 0.36;
      ctx.fillText(l.text, PAD, baseY);
      if (l.strike) {
        var w = ctx.measureText(l.text).width;
        ctx.fillRect(PAD, baseY - l.size * 0.3, w, Math.max(1.5, l.size * 0.055));
      }
      y += l.lh;
    });

    return c;
  }

  function toBlob(canvas) {
    return new Promise(function (resolve) {
      if (canvas.toBlob) canvas.toBlob(resolve, 'image/png');
      else resolve(null);
    });
  }


  window.QuoteShot = {
    copy: function (opts) {

function renderUserOptions() {
    const container = document.getElementById(&#39;userOptions&#39;);
    container.innerHTML = &#39;&#39;;
    for (let i = 1; i &lt;= 10; i++) {

    const container = document.getElementById(&#39;yearOptions&#39;);
    container.innerHTML = &#39;&#39;;
    // 可选年限：1年(无折扣)、3年(9折/省10%)、5年(8折/省20%)
    const yearList = [1, 3, 5];
    yearList.forEach(y =&gt; {
        const btn = document.createElement(&#39;button&#39;);
        btn.className = &#39;option-btn&#39; + (y === state.years ? &#39; active&#39; : &#39;&#39;);
        let label = y + &#39;年&#39;;
        const disc = PRICING.yearDiscount[y];
        if (disc &lt; 1) {
            // 统一使用全角括号，与「1年（无折扣）」保持一致
            label += &#39;（&#39; + Math.round(disc * 10) + &#39;折·省&#39; + Math.round((1 - disc) * 100) + &#39;%）&#39;;
        } else {
            label += &#39;（无折扣）&#39;;
        }
        btn.textContent = label;
        btn.onclick = () =&gt; selectOption(&#39;years&#39;, y, container, btn);
        container.appendChild(btn);
    });
}

function renderAccountOptions() {
    const container = document.getElementById(&#39;accountOptions&#39;);
    container.innerHTML = &#39;&#39;;
    [&#39;3&#39;, &#39;10&#39;, &#39;20&#39;].forEach(acc =&gt; {
        const btn = document.createElement(&#39;button&#39;);
        btn.className = &#39;option-btn&#39; + (acc === state.accounts ? &#39; active&#39; : &#39;&#39;);
        btn.textContent = acc + &#39;账套&#39;;
        btn.onclick = () =&gt; selectOption(&#39;accounts&#39;, acc, container, btn);
        container.appendChild(btn);
    });
}

function renderModules() {
    const container = document.getElementById(&#39;moduleList&#39;);
    container.innerHTML = &#39;&#39;;
    PRICING.modules.forEach(mod =&gt; {
        const isSelected = state.selectedModules.includes(mod.id);
        // 智能取票依赖财务模块：财务模块未勾选时禁用，不可单独选择
        const locked = (mod.id === &#39;tax&#39; &amp;&amp; !state.selectedModules.includes(&#39;accounting&#39;));
        const item = document.createElement(&#39;div&#39;);
        item.className = &#39;module-item&#39; + (isSelected ? &#39; selected&#39; : &#39;&#39;) + (locked ? &#39; disabled&#39; : &#39;&#39;);

        const tagClass = &#39;tag-&#39; + mod.tag;
        const lockHint = locked ? &#39;&lt;div class=&quot;module-lock&quot;&gt;⚠️ 需先勾选财务模块&lt;/div&gt;&#39; : &#39;&#39;;

        item.innerHTML = `
            &lt;div class=&quot;module-info&quot;&gt;
                &lt;div&gt;
                    &lt;div class=&quot;module-name&quot;&gt;${mod.name}&lt;/div&gt;
                    &lt;div class=&quot;module-desc&quot;&gt;${mod.desc}&lt;/div&gt;
                    ${lockHint}
                &lt;/div&gt;
            &lt;/div&gt;
            ${mod.id !== &#39;accounting&#39; ? `&lt;span class=&quot;module-tag ${tagClass}&quot;&gt;${mod.tagText}&lt;/span&gt;` : &#39;&#39;}
        `;
        item.onclick = locked ? null : () =&gt; toggleModule(mod.id);
        container.appendChild(item);
    });
}

function selectOption(key, value, container, btn) {
    // 点击已选中的项 → 取消选择（回到未选状态，触发清零）
    if (state[key] === value) {
        state[key] = null;
        container.querySelectorAll(&#39;.option-btn&#39;).forEach(b =&gt; b.classList.remove(&#39;active&#39;));
    } else {
        state[key] = value;
        container.querySelectorAll(&#39;.option-btn&#39;).forEach(b =&gt; b.classList.remove(&#39;active&#39;));
        btn.classList.add(&#39;active&#39;);
    }
    updatePrice();
}

function toggleModule(modId) {
    const mod = PRICING.modules.find(m =&gt; m.id === modId);

    const idx = state.selectedModules.indexOf(modId);
    if (idx &gt;= 0) {
        state.selectedModules.splice(idx, 1);
        // 取消财务模块时，自动取消依赖它的智能取票
        if (modId === &#39;accounting&#39;) {
            const taxIdx = state.selectedModules.indexOf(&#39;tax&#39;);
            if (taxIdx &gt;= 0) state.selectedModules.splice(taxIdx, 1);
        }
    } else {
        // 智能取票依赖财务模块，未勾选财务模块时禁止选择
        if (mod.id === &#39;tax&#39; &amp;&amp; !state.selectedModules.includes(&#39;accounting&#39;)) return;
        state.selectedModules.push(modId);
    }
    renderModules();
    updatePrice();
}

// ========== 价格计算 ==========
function calculatePrice() {
    // 完整性校验：账套数 / 用户数 / 使用年限 / 模块 任一未选 → 价格清零
    const incomplete = !state.accounts || !state.users || !state.years || state.selectedModules.length === 0;
    if (incomplete) {
        return { base: 0, listPrice: 0, originalTotal: 0, finalTotal: 0, discount: 1, incomplete: true };
    }

    // 1. 取上传价目表的官方价（财务模块年费）
    const listPrice = PRICING.priceMatrix[state.accounts][state.users];

    // 2. 模块加价（智能取票：198元/账套/年）
    let moduleTotal = 0;
    PRICING.modules.forEach(mod =&gt; {
        if (state.selectedModules.includes(mod.id)) {
            if (mod.pricePerAccount) {
                moduleTotal += mod.pricePerAccount * parseInt(state.accounts, 10);
            } else {
                moduleTotal += mod.price || 0;
            }
        }
    });

    // 3. 年费小计 = 官方价 + 模块年费
    const annualFee = listPrice + moduleTotal;

    // 4. 原价 = (官方价 + 模块) × 年数（含模块的总原价）
    const originalTotal = annualFee * state.years;

    // 5. 折后价 = 原价 × 年限折扣（恒 ≤ 原价）
    const discount = PRICING.yearDiscount[state.years];
    const finalTotal = Math.round(originalTotal * discount);

    return { base: annualFee, listPrice, originalTotal, finalTotal, discount };
}

function updatePrice() {
    const result = calculatePrice();

    // 更新显示（未选维度显示「请选择」）
    document.getElementById(&#39;dispAccounts&#39;).textContent = state.accounts ? state.accounts + &#39;账套&#39; : &#39;请选择&#39;;
    document.getElementById(&#39;dispUsers&#39;).textContent = state.users ? state.users + &#39;用户&#39; : &#39;请选择&#39;;
    document.getElementById(&#39;dispYears&#39;).textContent = state.years ? state.years + &#39;年&#39; : &#39;请选择&#39;;

    const modNames = state.selectedModules.map(id =&gt;
        PRICING.modules.find(m =&gt; m.id === id).name
    );
    document.getElementById(&#39;dispModules&#39;).textContent = modNames.length ? modNames.join(&#39; + &#39;) : &#39;请选择&#39;;

    document.getElementById(&#39;finalPrice&#39;).textContent = result.finalTotal;
    document.getElementById(&#39;origPrice&#39;).textContent = result.originalTotal;

    // 移动端底部价格栏：配置完整且价格 &gt; 0 时才显示
    const mpBar = document.getElementById(&#39;mobilePriceBar&#39;);
    if (!result.incomplete &amp;&amp; result.finalTotal &gt; 0) {
        document.getElementById(&#39;mpPrice&#39;).textContent = result.finalTotal;
        // 有折扣时显示划线原价
        const mpOrig = document.getElementById(&#39;mpOrig&#39;);
        if (result.discount &lt; 1 &amp;&amp; result.originalTotal !== result.finalTotal) {
            mpOrig.textContent = &#39;原价 ¥&#39; + result.originalTotal;
            mpOrig.style.display = &#39;inline&#39;;
        } else {
            mpOrig.style.display = &#39;none&#39;;
        }
        mpBar.classList.add(&#39;show&#39;);
    } else {
        mpBar.classList.remove(&#39;show&#39;);
    }

    // 折后价下方的「已享N年M折，节省¥XXX」备注（仅折扣时显示）
    const saveEl = document.getElementById(&#39;saveNote&#39;);
    if (!result.incomplete &amp;&amp; result.discount &lt; 1) {
        const saved = result.originalTotal - result.finalTotal;
        saveEl.textContent = `已享${state.years}年${Math.round(result.discount * 10)}折优惠，节省 ¥${saved}`;
    } else {
        saveEl.textContent = &#39;&#39;;
    }

}

function doCopyQuoteText(done) {
    if (!lastQuoteText) return;
    const fin = function () { if (done) done(); };
    const doCopy = function () {
        const ta = document.createElement(&#39;textarea&#39;);
        ta.value = lastQuoteText; ta.style.position = &#39;fixed&#39;; ta.style.opacity = &#39;0&#39;;
        document.body.appendChild(ta); ta.select();
        try { document.execCommand(&#39;copy&#39;); } catch (e) {}
        document.body.removeChild(ta);
        fin();
    };
    if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastQuoteText).then(fin, doCopy);
    } else { doCopy(); }
}

function copyQuote() {
    const result = calculatePrice();
    // 未选齐则不生成报价
    if (result.incomplete) {
        showToast(&#39;⚠️ 请先完成全部配置（账套数、用户数、使用年限、模块）&#39;);
        return;
    }
    const modNames = state.selectedModules.map(id =&gt; PRICING.modules.find(m =&gt; m.id === id).name).join(&#39;、&#39;);

    // 统一使用全角括号
    const yearLabel = state.years === 1 ? &#39;1年（无折扣）&#39; : state.years + &#39;年（&#39; + Math.round(result.discount * 10) + &#39;折·省&#39; + Math.round((1 - result.discount) * 100) + &#39;%）&#39;;
    const discountNote = result.discount &lt; 1 ? &#39;（原价 ¥&#39; + result.originalTotal + &#39;）&#39; : &#39;&#39;;
    // 复制文本中给原价加删除线（用组合下划线字符逐字叠加）
    const discountNoteStrike = discountNote ? discountNote.split(&#39;&#39;).join(&#39;\u0336&#39;) : &#39;&#39;;

    const text =
        &#39;金蝶精斗云报价单\n&#39; +
        &#39;━━━━━━━━━━━━━━━━━\n&#39; +
        &#39;服务模块：&#39; + modNames + &#39;\n&#39; +
        &#39;账套数：&#39; + state.accounts + &#39; 账套\n&#39; +
        &#39;用户数：&#39; + state.users + &#39; 用户\n&#39; +
        &#39;使用年限：&#39; + yearLabel + &#39;\n&#39; +
        &#39;━━━━━━━━━━━━━━━━━\n&#39; +
        &#39;最终价（无隐形费用）：¥&#39; + result.finalTotal + discountNoteStrike + &#39;\n\n&#39; +
        &#39;购买咨询强哥 18221094656&#39;;

    lastQuoteText = text;

    // 与星辰一致：先弹出报价单预览弹窗（可再点「复制文本」或「复制图片」）
    const quoteHtml =
        &#39;&lt;div style=&quot;height:3px;background:#1B3A5B;margin:2px 0 10px;width:180px;&quot;&gt;&lt;/div&gt;&#39; +
        &#39;服务模块：&#39; + modNames + &#39;\n&#39; +
        &#39;账套数：&#39; + state.accounts + &#39; 账套\n&#39; +
        &#39;用户数：&#39; + state.users + &#39; 用户\n&#39; +
        &#39;使用年限：&#39; + yearLabel + &#39;\n&#39; +
        &#39;&lt;div style=&quot;height:3px;background:#1B3A5B;width:180px;margin:10px 0 8px;&quot;&gt;&lt;/div&gt;&#39; +
        &#39;&lt;span style=&quot;font-weight:800;color:#1B3A5B;&quot;&gt;最终价（无隐形费用）：¥&#39; + result.finalTotal + &#39;&lt;/span&gt;&#39; +
        (discountNote ? &#39;&lt;s style=&quot;color:#999;&quot;&gt;&#39; + discountNote + &#39;&lt;/s&gt;&#39; : &#39;&#39;) + &#39;\n\n&#39; +
        &#39;购买咨询强哥 18221094656&#39;;
    showQuoteModal(quoteHtml);

    // 以图片形式复制（整张报价单）；微信等移动端浏览器不支持图片剪贴板时，直接复制文本
    const strikeOrig = discountNote;
    if (!(navigator.clipboard &amp;&amp; window.ClipboardItem &amp;&amp; navigator.clipboard.write)) {
        doCopyQuoteText(function () { showToast(&#39;报价已复制，可以手机截图或者粘贴发送&#39;, true); });
        return;
    }
    QuoteShot.copy({
        title: &#39;金蝶精斗云报价单&#39;,
        filename: &#39;金蝶精斗云报价单&#39;,
        onTip: function (msg, ok) {
            if (!ok) { doCopyQuoteText(function () { showToast(&#39;报价已复制，可以手机截图或者粘贴发送&#39;, true); }); return; }
            showToast(&#39;报价已复制，可以手机截图或者粘贴发送&#39;, true);
        },
        blocks: [
            { type: &#39;text&#39;, text: &#39;服务模块：&#39; + modNames },
            { type: &#39;text&#39;, text: &#39;账套数：&#39; + state.accounts + &#39; 账套&#39; },
            { type: &#39;text&#39;, text: &#39;用户数：&#39; + state.users + &#39; 用户&#39; },
            { type: &#39;text&#39;, text: &#39;使用年限：&#39; + yearLabel },
            { type: &#39;hr&#39; },
            { type: &#39;text&#39;, text: &#39;最终价（无隐形费用）：¥&#39; + result.finalTotal, weight: &#39;800&#39;, size: 34, color: &#39;#1B3A5B&#39;, lh: 54 },
            discountNote ? { type: &#39;text&#39;, text: strikeOrig, size: 26, color: &#39;#999999&#39;, strike: true } : { type: &#39;gap&#39;, h: 0 },
            { type: &#39;gap&#39;, h: 18 },
            { type: &#39;text&#39;, text: &#39;购买咨询强哥 18221094656&#39;, color: &#39;#555555&#39; }
        ]
    });
}

// 轻量提示：显示 3 秒后自动淡出关闭
let toastTimer = null;
function showToast(msg) {
    let el = document.getElementById(&#39;toast&#39;);
    if (!el) {
        el = document.createElement(&#39;div&#39;);
        el.id = &#39;toast&#39;;
        el.className = &#39;toast&#39;;
        document.body.appendChild(el);
    }
    el.textContent = msg;
    // 触发进入动画
    requestAnimationFrame(() =&gt; el.classList.add(&#39;show&#39;));
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() =&gt; {
        el.classList.remove(&#39;show&#39;);
    }, 3000);
}

// ===================== 报价单预览弹窗 =====================
let lastQuoteText = &#39;&#39;;
function showQuoteModal(html) {
    const body = document.getElementById(&#39;qmBody&#39;);
    if (body) body.innerHTML = html;
    const mask = document.getElementById(&#39;qmMask&#39;);
    if (mask) mask.classList.add(&#39;show&#39;);
}
function hideQuoteModal() {
    const mask = document.getElementById(&#39;qmMask&#39;);
    if (mask) mask.classList.remove(&#39;show&#39;);
}
function copyQuoteText() {
    if (!lastQuoteText) return;
    const done = () =&gt; { showToast(&#39;报价文本已复制&#39;); };
    const doCopy = () =&gt; {
        const ta = document.createElement(&#39;textarea&#39;);
        ta.value = lastQuoteText; ta.style.position = &#39;fixed&#39;; ta.style.opacity = &#39;0&#39;;
        document.body.appendChild(ta); ta.select();
        try { document.execCommand(&#39;copy&#39;); } catch (e) {}
        document.body.removeChild(ta);
    };
    if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastQuoteText).then(done, function(){ doCopy(); done(); });
    } else { doCopy(); done(); }
}

// 启动
init();

/**
 * 报价单「复制为图片」通用实现（Canvas 手绘，无外部依赖）
 * 用法：QuoteShot.copy({ title, blocks, filename, onTip })
 * blocks: {type:&#39;text&#39;, text, size, weight, color, lh, strike} | {type:&#39;hr&#39;} | {type:&#39;gap&#39;, h}
 */
(function () {
  var FONT = &#39;&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,&quot;Segoe UI&quot;,sans-serif&#39;;

function wrap(ctx, text, maxW) {
    var lines = [];
    String(text).split(&#39;\n&#39;).forEach(function (raw) {
      if (raw === &#39;&#39;) { lines.push(&#39;&#39;); return; }
      var cur = &#39;&#39;;
      for (var i = 0; i &lt; raw.length; i++) {
        var ch = raw[i];
        if (ctx.measureText(cur + ch).width &gt; maxW &amp;&amp; cur) { lines.push(cur); cur = ch; }
        else { cur += ch; }
      }
      lines.push(cur);
    });
    return lines;
  }

  function draw(opts) {
    var W = opts.width || 750;
    var PAD = 56;
    var innerW = W - PAD * 2;
    var measure = document.createElement(&#39;canvas&#39;).getContext(&#39;2d&#39;);
    var rows = [];
    var title = opts.title || &#39;&#39;;
    var blocks = opts.blocks || [];

    measure.font = &#39;800 40px &#39; + FONT;
    var titleLines = wrap(measure, title || &#39; &#39;, innerW);
    var titleLH = 56;

    blocks.forEach(function (b) {
      if (b.type === &#39;hr&#39;) { rows.push({ type: &#39;hr&#39; }); return; }
      if (b.type === &#39;gap&#39;) { rows.push({ type: &#39;gap&#39;, h: b.h || 0 }); return; }
      var size = b.size || 29;
      var weight = b.weight || &#39;400&#39;;
      var lh = b.lh || Math.round(size * 1.8);
      measure.font = weight + &#39; &#39; + size + &#39;px &#39; + FONT;
      wrap(measure, b.text, innerW).forEach(function (ln) {
        rows.push({ type: &#39;text&#39;, text: ln, size: size, weight: weight, color: b.color || &#39;#333333&#39;, lh: lh, strike: !!b.strike });
      });
    });

    var H = PAD + 10;
    H += titleLines.length * titleLH + 14;
    rows.forEach(function (l) {
      if (l.type === &#39;hr&#39;) H += 2 + 30;
      else if (l.type === &#39;gap&#39;) H += l.h;
      else H += l.lh;
    });
    H += PAD;

    var scale = 2;
    var c = document.createElement(&#39;canvas&#39;);
    c.width = W * scale;
    c.height = H * scale;
    var ctx = c.getContext(&#39;2d&#39;);
    ctx.scale(scale, scale);
    ctx.textBaseline = &#39;alphabetic&#39;;

    ctx.fillStyle = &#39;#ffffff&#39;;
    ctx.fillRect(0, 0, W, H);

    var y = PAD + 10;
    ctx.fillStyle = opts.titleColor || &#39;#1B3A5B&#39;;
    ctx.font = &#39;800 40px &#39; + FONT;
    titleLines.forEach(function (ln) {
      ctx.fillText(ln, PAD, y + 40);
      y += titleLH;
    });

    y += 14;
    ctx.fillRect(PAD, y, 240, 3);
    y += 12;

    rows.forEach(function (l) {
      if (l.type === &#39;hr&#39;) {
        ctx.fillStyle = opts.hrColor || &#39;#1B3A5B&#39;;
        ctx.fillRect(PAD, y + 12, 240, 3);
        y += 3 + 26;
        return;
      }
      if (l.type === &#39;gap&#39;) { y += l.h; return; }
      ctx.fillStyle = l.color;
      ctx.font = l.weight + &#39; &#39; + l.size + &#39;px &#39; + FONT;
      var baseY = y + l.lh / 2 + l.size * 0.36;
      ctx.fillText(l.text, PAD, baseY);
      if (l.strike) {
        var w = ctx.measureText(l.text).width;
        ctx.fillRect(PAD, baseY - l.size * 0.3, w, Math.max(1.5, l.size * 0.055));
      }
      y += l.lh;
    });

    return c;
  }

  function toBlob(canvas) {
    return new Promise(function (resolve) {
      if (canvas.toBlob) canvas.toBlob(resolve, &#39;image/png&#39;);
      else resolve(null);
    });
  }


  window.QuoteShot = {
    copy: function (opts) {
      var tip = opts.onTip || function () {};
      var name = opts.filename || &#39;报价单&#39;;
      var canvas = draw(opts);
      toBlob(canvas).then(function (blob) {
        if (!blob) { tip(&#39;图片生成失败，请改用复制文本&#39;, false); return; }


        // 直接复制图片到剪贴板
        if (navigator.clipboard &amp;&amp; window.ClipboardItem &amp;&amp; navigator.clipboard.write) {
          navigator.clipboard.write([new ClipboardItem({ &#39;image/png&#39;: blob })]).then(function () {
            tip(&#39;报价已复制，可以手机截图或者粘贴发送&#39;, true);
          }, function () {
            tip(&#39;当前环境不支持复制图片，请改用复制文本&#39;, false);
          });
        } else {
          tip(&#39;当前环境不支持复制图片，请改用复制文本&#39;, false);
        }
      });
    }
  };

})();

&lt;title&gt;金蝶AI星辰 · 在线报价器&lt;/title&gt;
&lt;style&gt;
:root {
  --blue: #0096F2;
  --dark: #1B3A5B;
  --light: #E8F4FD;
  --orange: #FF8C00;
  --green: #52C41A;
  --bg: #F5F7FA;
  --t1: #1A1A1A;
  --t2: #666;
  --t3: #999;
  --bd: #E0E0E0;
  --sh: 0 2px 12px rgba(0,0,0,0.08);
  --sh-lg: 0 8px 32px rgba(0,0,0,0.12);
  --r: 12px;
  --rs: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
  background: var(--bg);
  color: var(--t1);
  line-height: 1.7;
  font-size: 16px;
}

/* Header */
.hdr {
  background: linear-gradient(135deg, var(--dark) 0%, var(--blue) 100%);
  color: #fff;
  padding: 36px 0 32px;
  text-align: center;
}
.hdr h1 { font-size: 32px; font-weight: 800; letter-spacing: 1px; line-height: 1.5; }
.hdr .sub { font-size: 16px; opacity: 0.85; margin-top: 8px; }
.hdr .tag {
  display: inline-block; margin-top: 12px;
  background: rgba(255,255,255,0.15);
  padding: 5px 18px; border-radius: 20px;
  font-size: 14px;
}

/* Layout */
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.body-wrap { display: flex; gap: 24px; padding: 28px 0 60px; align-items: flex-start; }
.left { flex: 1; min-width: 0; }
.right { width: 360px; flex-shrink: 0; position: sticky; top: 16px; }

/* Card */
.card {
  background: #fff;
  border-radius: var(--r);
  box-shadow: var(--sh);
  padding: 26px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 19px; font-weight: 700;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.card-title .n {
  width: 32px; height: 32px;
  background: var(--blue); color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
}
.card-desc { font-size: 15px; color: var(--t3); margin-bottom: 16px; }

/* Version Cards */
.ver-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.ver {
  border: 2px solid var(--bd);
  border-radius: var(--rs);
  padding: 20px 16px;
  cursor: pointer;
  transition: all 0.25s;
  text-align: center;
  position: relative;
}
.ver:hover { border-color: var(--blue); background: var(--light); }
.ver.on {
  border-color: var(--blue);
  background: var(--light);
  box-shadow: 0 0 0 1px var(--blue);
}
.ver .vn { font-size: 18px; font-weight: 700; color: var(--dark); }
.ver .vp { font-size: 26px; font-weight: 800; color: var(--blue); margin: 8px 0 4px; }
.ver .vp sm { font-size: 14px; font-weight: 400; }
.ver .vd { font-size: 13px; color: var(--t3); line-height: 1.5; }
.ver .vtag {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  background: var(--orange); color: #fff; font-size: 12px;
  padding: 3px 12px; border-radius: 10px; white-space: nowrap;
}

/* User Options */
.usr-grid { display: flex; gap: 12px; flex-wrap: wrap; }
.usr {
  flex: 1; min-width: 100px;
  padding: 16px 10px;
  border: 2px solid var(--bd);
  border-radius: var(--rs);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.usr:hover { border-color: var(--blue); }
.usr.on { border-color: var(--blue); background: var(--light); box-shadow: 0 0 0 1px var(--blue); }
.usr .un { font-size: 17px; font-weight: 700; color: var(--dark); }
.usr .up { font-size: 24px; font-weight: 800; color: var(--blue); margin: 4px 0; }
.usr .up sm { font-size: 13px; font-weight: 400; }
.usr .ud { font-size: 13px; color: var(--t3); }

/* Year Options */
.yr-grid { display: flex; gap: 12px; }
.yr {
  flex: 1;
  padding: 18px 10px;
  border: 2px solid var(--bd);
  border-radius: var(--rs);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.yr:hover { border-color: var(--blue); }
.yr.on { border-color: var(--blue); background: var(--light); }
.yr .yn { font-size: 22px; font-weight: 700; }
.yr .yd { font-size: 14px; color: var(--orange); margin-top: 4px; }

/* Addon */
.addon {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border: 1px solid var(--bd);
  border-radius: var(--rs);
  margin-bottom: 10px;
  transition: all 0.2s;
}
.addon:hover { border-color: var(--blue); }
.addon .al { display: flex; align-items: center; gap: 12px; }
.addon input[type=&quot;checkbox&quot;] {
  width: 20px; height: 20px; accent-color: var(--blue);
  cursor: pointer;
}
.addon .an { font-size: 16px; font-weight: 600; }
.addon .ad { font-size: 14px; color: var(--t3); }
.addon .ap { font-size: 16px; font-weight: 600; color: var(--blue); white-space: nowrap; }

/* Info Note */
.note {
  background: #FFF7E6;
  border: 1px solid #FFE58F;
  border-radius: var(--rs);
  padding: 14px 18px;
  font-size: 15px;
  color: #8C6A1A;
  margin-bottom: 16px;
  line-height: 1.7;
}

/* Summary */
.sum {
  background: #fff;
  border-radius: var(--r);
  box-shadow: var(--sh-lg);
  overflow: hidden;
}
.sum-hdr {
  background: linear-gradient(135deg, var(--dark) 0%, var(--blue) 100%);
  color: #fff;
  padding: 22px 26px;
}
.sum-hdr h3 { font-size: 22px; font-weight: 700; }
.sum-hdr p { font-size: 14px; opacity: 0.8; margin-top: 4px; }
.sum-body { padding: 22px 26px; }

.sum-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--t3); margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
}
.plan-no { font-weight: 700; color: var(--dark); }

.s-line {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 8px 0;
  font-size: 16px;
}
.s-line .sl { color: var(--t2); }
.s-line .sv { font-weight: 600; text-align: right; }
.s-line .sv sm { font-size: 14px; font-weight: 400; color: var(--t3); }
.s-div { height: 1px; background: var(--bd); margin: 10px 0; }

.s-total {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0 6px;
}
.s-total .tl { font-size: 18px; font-weight: 700; }
.s-total .tp { font-size: 36px; font-weight: 800; color: var(--blue); }
.s-total .tp sm { font-size: 16px; font-weight: 400; }

.s-save {
  text-align: right; font-size: 15px; color: var(--orange);
  margin-bottom: 14px;
}

.s-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.btn {
  padding: 15px 20px;
  border: none; border-radius: var(--rs);
  font-size: 17px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  text-align: center;
}
.btn-p { background: var(--blue); color: #fff; }
.btn-p:hover { background: #0079CC; }
.btn-o { background: #fff; color: var(--blue); border: 2px solid var(--blue); }
.btn-o:hover { background: var(--light); }
.btn-sm { padding: 11px 14px; font-size: 15px; }
.btn-ghost {
  background: none; border: none;
  color: var(--t3); font-size: 14px; cursor: pointer;
  text-decoration: underline;
}
.btn-ghost:hover { color: var(--orange); }


/* Contact Form */
.cform { display: none; margin-top: 16px; }
.cform.on { display: block; }
.fg { margin-bottom: 12px; }
.fg label { display: block; font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.fg input, .fg textarea {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--bd);
  border-radius: var(--rs);
  font-size: 16px; outline: none;
  transition: border-color 0.2s;
}
.fg input:focus, .fg textarea:focus { border-color: var(--blue); }
.fg textarea { resize: vertical; min-height: 70px; }

/* Disclaimer */
.disc {
  font-size: 14px; color: var(--t3);
  text-align: center; padding: 20px;
  line-height: 1.8;
}

/* 页脚二维码卡片（与金蝶精斗云一致） */
.footer-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.qr-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
    background: #fff;
    border: 1px solid #eef0f3;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    margin-bottom: 16px;
}
.qr-img {
    width: 155px;
    height: 155px;
    display: block;
    border-radius: 6px;
}
.qr-tip {
    font-size: 15px;
    color: #1890ff;
    font-weight: 600;
    text-align: center;
}

/* QR placeholder */
.qr-ph {
  width: 120px; height: 120px; margin: 0 auto;
  border: 1px dashed #C9D4E0; border-radius: 8px;
  background: #FAFBFC;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.qr-ph-t { font-size: 14px; font-weight: 700; color: var(--dark); }
.qr-ph-s { font-size: 11px; color: var(--t3); line-height: 1.5; text-align: center; padding: 0 8px; }

/* Toast */
.toast {
  position: fixed; bottom: 96px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--dark); color: #fff;
  padding: 14px 28px;
  border-radius: var(--rs);
  font-size: 16px; font-weight: 600;
  box-shadow: var(--sh-lg);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { background: var(--green); }

/* Price Table */
.ptable {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  margin-top: 8px;
}
.ptable th, .ptable td {
  border: 1px solid var(--bd);
  padding: 10px 12px;
  text-align: center;
}
.ptable th {
  background: var(--light);
  color: var(--dark);
  font-weight: 700;
}
.ptable .hl { color: var(--blue); font-weight: 700; }

/* Mobile sticky bar */
.mbar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  background: #fff; border-top: 1px solid var(--bd);
  box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index: 900;
  align-items: center; gap: 12px;
}
.mbar .mp { flex: 1; min-width: 0; }
.mbar .mp .ml { font-size: 12px; color: var(--t3); line-height: 1.3; }
.mbar .mp .mv { font-size: 22px; font-weight: 800; color: var(--blue); line-height: 1.2; }
.mbar .mb { padding: 11px 16px; font-size: 15px; flex-shrink: 0; }

/* Responsive */
@media (max-width: 900px) {
  .body-wrap { flex-direction: column; }
  .right { width: 100%; position: static; }
  .ver-grid { grid-template-columns: 1fr; }
  .usr-grid { flex-direction: column; }
  .yr-grid { flex-direction: column; }
  .mbar { display: flex; }
  body { padding-bottom: 78px; }
}
@media (max-width: 400px) {
  .mbar .mv { font-size: 19px; }
  .mbar .mb { padding: 10px 12px; }
  .addon { padding: 10px 10px !important; }
  .addon .stepper button { width: 26px !important; }
  .addon .stepper input { width: 34px !important; height: 34px !important; font-size: 15px !important; }
  .addon .stepper button { height: 34px !important; }
}
@media (max-width: 600px) {
  .hdr h1 { font-size: 24px; line-height: 1.5; }
  .wrap { padding: 0 12px; }
  .card { padding: 18px; }
  .addon { padding: 12px 12px !important; }
  .addon &gt; div:last-child { flex-wrap: wrap !important; row-gap: 8px !important; }
  .addon .an, .addon .ad { overflow-wrap: anywhere; }
  .sum-body { padding: 18px; }
  .ptable { font-size: 13px; }
  .ptable th, .ptable td { padding: 8px 6px; }
  .sum-meta { flex-direction: column; align-items: flex-start; }
}

.hidden { display: none !important; }

&lt;div class=&quot;hdr&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;

&lt;/div&gt;

&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;body-wrap&quot;&gt;
    &lt;!-- Left: Config --&gt;
    &lt;div class=&quot;left&quot;&gt;

      &lt;!-- Step 1: Version --&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-title&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;选择版本&lt;/div&gt;
        &lt;div class=&quot;card-desc&quot;&gt;根据实际情况选择&lt;/div&gt;
        &lt;div class=&quot;ver-grid&quot; id=&quot;ver-grid&quot;&gt;
          &lt;div class=&quot;ver&quot; data-ver=&quot;standard&quot; onclick=&quot;selVer(this)&quot;&gt;
            &lt;div class=&quot;vn&quot;&gt;AI星辰标准版&lt;/div&gt;

          &lt;/div&gt;
          &lt;div class=&quot;ver&quot; data-ver=&quot;professional&quot; onclick=&quot;selVer(this)&quot;&gt;
            &lt;div class=&quot;vn&quot;&gt;AI星辰专业版&lt;/div&gt;
            &lt;div class=&quot;vp&quot;&gt;2800&lt;sm&gt;元/年起&lt;/sm&gt;&lt;/div&gt;
            &lt;div class=&quot;vd&quot;&gt;默认2个用户2个账套&lt;br&gt;具备多账套报表汇总&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;ver&quot; data-ver=&quot;flagship&quot; onclick=&quot;selVer(this)&quot;&gt;

            &lt;div class=&quot;vtag&quot;&gt;最受欢迎&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- Step 2: Other Modules --&gt;
      &lt;div class=&quot;card&quot; id=&quot;module-card&quot; style=&quot;opacity: 0.5; pointer-events: none;&quot;&gt;
        &lt;div class=&quot;card-title&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;选择模块&lt;/div&gt;

          &lt;/div&gt;

        &lt;/div&gt;
        &lt;div class=&quot;addon&quot;&gt;

            &lt;input type=&quot;checkbox&quot; id=&quot;ao-jxc&quot; onchange=&quot;calc()&quot; disabled=&quot;&quot;&gt;

          &lt;div class=&quot;al&quot;&gt;
            &lt;input type=&quot;checkbox&quot; id=&quot;ao-prod&quot; onchange=&quot;calc()&quot; disabled=&quot;&quot;&gt;

      &lt;!-- Step 3: Users --&gt;
      &lt;div class=&quot;card&quot; id=&quot;user-card&quot; style=&quot;opacity: 0.5; pointer-events: none;&quot;&gt;

// ===================== 本地存储（带异常保护） =====================
const LS_KEY = { state: &#39;kd_quote_state_v1&#39;, plans: &#39;kd_quote_plans_v1&#39;, seq: &#39;kd_quote_seq_v1&#39; };
function lsGet(k, def) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
function lsDel(k) {
  try { localStorage.removeItem(k); } catch (e) {}
}

// ===================== 状态 =====================
let S = {
  ver: null,
  users: 0,
  accounts: 0,
  years: 0,
  discount: 1.0,
  jxc: false,
  fin: false,
  prod: false,
  lingjiStd: 0,
  lingjiStdYr: 1,
  lingjiPro: 0,
  lingjiProYr: 1,
  lingjiPack: 0
};

// ===================== 工具函数 =====================
function el(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString(&#39;zh-CN&#39;); }
function pad2(n) { return n &lt; 10 ? &#39;0&#39; + n : &#39;&#39; + n; }
function esc(s) {
  return String(s).replace(/&amp;/g, &#39;&amp;amp;&#39;).replace(/&lt;/g, &#39;&amp;lt;&#39;).replace(/&gt;/g, &#39;&amp;gt;&#39;)
    .replace(/&quot;/g, &#39;&amp;quot;&#39;).replace(/&#39;/g, &#39;&amp;#39;&#39;);
}
function dcTextOf(dc) { return dc === 0.9 ? &#39;9折&#39; : dc === 0.8 ? &#39;8折&#39; : &#39;&#39;; }
function nowStr() {
  const d = new Date();
  return d.getFullYear() + &#39;-&#39; + pad2(d.getMonth() + 1) + &#39;-&#39; + pad2(d.getDate()) +
    &#39; &#39; + pad2(d.getHours()) + &#39;:&#39; + pad2(d.getMinutes());
}

// ===================== 选择版本 =====================
function selVer(vEl) {
  // 再次点击已选中的版本 → 取消选择，恢复初始默认状态
  if (S.ver &amp;&amp; vEl.dataset.ver === S.ver) {
    unselectVersion();
    return;
  }
  S.ver = vEl.dataset.ver;
  document.querySelectorAll(&#39;#ver-grid .ver&#39;).forEach(v =&gt; v.classList.remove(&#39;on&#39;));
  vEl.classList.add(&#39;on&#39;);
  const d = DATA[S.ver];
  // 重置用户数为版本基础值
  S.users = d.baseUsers;
  el(&#39;user-input&#39;).value = d.baseUsers;
  el(&#39;user-input&#39;).min = d.baseUsers;
  el(&#39;user-desc&#39;).textContent = &#39;基础含&#39; + d.baseUsers + &#39;个用户，可按需增购&#39;;
  el(&#39;user-price-label&#39;).textContent = d.userPrice + &#39;元/年/人&#39;;
  // 重置账套数为版本基础值
  S.accounts = d.accounts;
  el(&#39;acct-input&#39;).value = d.accounts;
  el(&#39;acct-input&#39;).min = d.accounts;
  el(&#39;acct-desc&#39;).textContent = &#39;基础含&#39; + d.accounts + &#39;个账套，可按需增购&#39;;
  el(&#39;acct-price-label&#39;).textContent = d.acctPrice + &#39;元/年/个&#39;;
  // 更新模块价格标签
  const j = JXC[S.ver];
  el(&#39;jxc-price-label&#39;).textContent = j.basePrice + &#39;元/年&#39;;
  el(&#39;fin-price-label&#39;).textContent = d.basePrice + &#39;元/年&#39;;
  // 启用模块卡片
  const mc = el(&#39;module-card&#39;);
  mc.style.opacity = &#39;1&#39;;
  mc.style.pointerEvents = &#39;auto&#39;;
  el(&#39;module-note&#39;).textContent = &#39;财务云为版本基础模块（已默认勾选）；可按需加选进销存 / 生产模块。&#39;;
  document.querySelectorAll(&#39;#module-card input[type=&quot;checkbox&quot;]&#39;).forEach(cb =&gt; cb.disabled = false);
  // 启用购买年限卡片
  el(&#39;year-card&#39;).style.opacity = &#39;1&#39;;
  el(&#39;year-card&#39;).style.pointerEvents = &#39;auto&#39;;
  el(&#39;year-desc&#39;).textContent = &#39;多年购买享折扣优惠&#39;;
  // 财务云模块：版本基础模块，默认勾选
  el(&#39;ao-fin&#39;).checked = true;
  S.fin = true;
  // 生产云模块仅旗舰版可选
  const prodAddon = el(&#39;prod-addon&#39;);
  const prodCb = el(&#39;ao-prod&#39;);
  if (S.ver === &#39;flagship&#39;) {
    prodAddon.style.display = &#39;&#39;;
    prodCb.disabled = false;
  } else {
    prodAddon.style.display = &#39;none&#39;;
    prodCb.checked = false;
    prodCb.disabled = true;
    S.prod = false;
  }
  // 启用灵基点数包步进器与增值服务卡片
  const packRow = el(&#39;lingji-pack-row&#39;);
  packRow.style.opacity = &#39;1&#39;;
  packRow.style.pointerEvents = &#39;auto&#39;;
  const ac = el(&#39;addon-card&#39;);
  ac.style.opacity = &#39;1&#39;;
  ac.style.pointerEvents = &#39;auto&#39;;
  // 默认选中「1年」，避免漏选年限导致算不出总价
  if (!S.years) {
    const y1 = document.querySelector(&#39;#yr-grid .yr[data-yr=&quot;1&quot;]&#39;);
    if (y1) selYr(y1);
  }
  calc();
}

// ===================== 取消选择版本 =====================
function unselectVersion() {
  S.ver = null;
  document.querySelectorAll(&#39;#ver-grid .ver&#39;).forEach(v =&gt; v.classList.remove(&#39;on&#39;));
  S.fin = false; S.jxc = false; S.prod = false;
  S.years = 0; S.discount = 1.0;
  S.users = 0; S.accounts = 0;
  el(&#39;user-input&#39;).value = 1;
  el(&#39;user-input&#39;).min = 1;
  el(&#39;acct-input&#39;).value = 2;
  el(&#39;acct-input&#39;).min = 2;
  // 模块卡片：恢复禁用
  const mc = el(&#39;module-card&#39;);
  mc.style.opacity = &#39;0.5&#39;;
  mc.style.pointerEvents = &#39;none&#39;;
  el(&#39;module-note&#39;).textContent = &#39;请先选择版本&#39;;
  document.querySelectorAll(&#39;#module-card input[type=&quot;checkbox&quot;]&#39;).forEach(cb =&gt; {
    cb.checked = false;
    cb.disabled = true;
  });
  // 生产模块行隐藏
  el(&#39;prod-addon&#39;).style.display = &#39;none&#39;;
  // 用户数 / 账套数 / 年限卡片：恢复禁用
  [&#39;user-card&#39;, &#39;acct-card&#39;, &#39;year-card&#39;].forEach(id =&gt; {
    el(id).style.opacity = &#39;0.5&#39;;
    el(id).style.pointerEvents = &#39;none&#39;;
  });
  el(&#39;user-desc&#39;).textContent = &#39;请先选择版本&#39;;

// ===================== 统一计算（计算与导出共用） =====================
function compute() {
  const d = DATA[S.ver];
  if (!d) return null;
  const items = [];
  let yrPrice = 0;

  if (S.fin) {
    yrPrice += d.basePrice;
    items.push({ label: &#39;财务云模块&#39;, calc: fmt(d.basePrice) + &#39;元/年&#39;, amt: d.basePrice });
  }
  if (S.jxc) {
    const j = JXC[S.ver];
    yrPrice += j.basePrice;
    items.push({ label: &#39;进销存云模块&#39;, calc: fmt(j.basePrice) + &#39;元/年&#39;, amt: j.basePrice });
  }
  if (S.prod &amp;&amp; S.ver === &#39;flagship&#39;) {
    yrPrice += 4000;
    items.push({ label: &#39;生产云模块&#39;, calc: &#39;4,000元/年&#39;, amt: 4000 });
  }
  const extraUsers = Math.max(0, S.users - d.baseUsers);
  if (extraUsers &gt; 0) {
    const f = extraUsers * d.userPrice;
    yrPrice += f;
    items.push({ label: &#39;增购用户&#39;, calc: extraUsers + &#39;人×&#39; + fmt(d.userPrice) + &#39;元/年&#39;, amt: f });
  }
  const extraAccts = Math.max(0, S.accounts - d.accounts);
  if (extraAccts &gt; 0) {
    const f = extraAccts * d.acctPrice;
    yrPrice += f;
    items.push({ label: &#39;增购账套&#39;, calc: extraAccts + &#39;个×&#39; + fmt(d.acctPrice) + &#39;元/年&#39;, amt: f });
  }

  const lingjiRows = [];
  let lingjiYr = 0;
  if (S.lingjiStd &gt; 0 &amp;&amp; S.lingjiStdYr &gt; 0) {
    const f = S.lingjiStd * 168 * S.lingjiStdYr;
    lingjiYr += f;
    lingjiRows.push({ label: &#39;金蝶灵基AI标准版&#39;, calc: S.lingjiStd + &#39;人×168元×&#39; + S.lingjiStdYr + &#39;年（含1200点/人/年）&#39;, amt: f });
  }
  if (S.lingjiPro &gt; 0 &amp;&amp; S.lingjiProYr &gt; 0) {
    const f = S.lingjiPro * 688 * S.lingjiProYr;
    lingjiYr += f;
    lingjiRows.push({ label: &#39;金蝶灵基AI专业版&#39;, calc: S.lingjiPro + &#39;人×688元×&#39; + S.lingjiProYr + &#39;年（含6000点/人/年）&#39;, amt: f });
  }
  let lingjiPack = 0;
  if (S.lingjiPack &gt; 0) {
    lingjiPack = S.lingjiPack * 1000;
    lingjiRows.push({ label: &#39;灵基点数加点包&#39;, calc: S.lingjiPack + &#39;份×1000元（每份含5000点，合计&#39; + fmt(S.lingjiPack * 5000) + &#39;点）&#39;, amt: lingjiPack });
  }

  let implFee = 0;
  if (S.ver === &#39;standard&#39; &amp;&amp; S.jxc) {
    implFee = 2000;
  } else if (S.ver === &#39;professional&#39; &amp;&amp; S.jxc) {
    implFee = 3000;
  } else if (S.ver === &#39;flagship&#39; &amp;&amp; S.jxc &amp;&amp; S.prod) {
    implFee = 6000;
  } else if (S.ver === &#39;flagship&#39; &amp;&amp; S.jxc) {
    implFee = 4000;
  }

  const orig = yrPrice * S.years;
  const disc = yrPrice * S.years * S.discount;
  const all = disc + lingjiYr + lingjiPack + implFee;
  const saved = Math.round(yrPrice * S.years * (1 - S.discount));
  const dcText = dcTextOf(S.discount);

  return { d, items, yrPrice, lingjiRows, lingjiYr, lingjiPack, implFee, orig, disc, all, saved, dcText, extraUsers, extraAccts };
}

// ===================== 计算与渲染 =====================
function calc() {
  S.jxc = el(&#39;ao-jxc&#39;).checked;
  S.fin = el(&#39;ao-fin&#39;).checked;
  S.prod = el(&#39;ao-prod&#39;).checked;

  // 生产云模块：仅旗舰版且已选进销存云模块时才可勾选
  const prodCb = el(&#39;ao-prod&#39;);
  if (S.ver === &#39;flagship&#39; &amp;&amp; S.jxc) {
    prodCb.disabled = false;
  } else {
    prodCb.checked = false;
    prodCb.disabled = true;
    S.prod = false;
  }
  if (!S.ver) {
    el(&#39;mbar-label&#39;).textContent = &#39;最终价&#39;;
    el(&#39;mbar-price&#39;).textContent = &#39;—&#39;;
    el(&#39;s-lines&#39;).innerHTML = &#39;&lt;div class=&quot;s-line&quot;&gt;&lt;span class=&quot;sl&quot; style=&quot;color:var(--t3);&quot;&gt;请先选择版本&lt;/span&gt;&lt;span class=&quot;sv&quot;&gt;—&lt;/span&gt;&lt;/div&gt;&#39;;
    el(&#39;sum-users&#39;).textContent = 0;
    el(&#39;sum-accts&#39;).textContent = 0;
    el(&#39;sum-years&#39;).textContent = 0;
    el(&#39;orig-price&#39;).textContent = &#39;—&#39;;
    el(&#39;disc-price&#39;).textContent = &#39;—&#39;;
    el(&#39;all-price&#39;).textContent = &#39;—&#39;;
    el(&#39;s-save&#39;).textContent = &#39;&#39;;
    el(&#39;lingji-line&#39;).style.display = &#39;none&#39;;
    el(&#39;impl-line&#39;).style.display = &#39;none&#39;;
    el(&#39;sum-title&#39;).textContent = &#39;报价汇总&#39;;
    return;
  }

  // 未选择任何模块时，灵基AI人数与加点包自动清零
  const anyModule = S.fin || S.jxc || S.prod;
  if (!anyModule) {
    [&#39;lingji-std-input&#39;, &#39;lingji-pro-input&#39;, &#39;pack-input&#39;].forEach(function (id) {
      const inp = el(id);
      if ((parseInt(inp.value) || 0) &gt; 0) { inp.value = 0; }
    });
  }

  // 灵基AI：年限固定 1 年（只能 1 年 1 年购买，不可修改）
  S.lingjiStd = parseInt(el(&#39;lingji-std-input&#39;).value) || 0;
  S.lingjiStdYr = 1;
  S.lingjiPro = parseInt(el(&#39;lingji-pro-input&#39;).value) || 0;
  S.lingjiProYr = 1;
  S.lingjiPack = parseInt(el(&#39;pack-input&#39;).value) || 0;

  const r = compute();
  if (!r) return;
  const d = r.d;
  el(&#39;sum-title&#39;).textContent = &#39;金蝶AI星辰&#39; + d.name + &#39;报价&#39;;

  // ---- 明细行（汇总区）----
  let linesHTML = &#39;&#39;;
  if (!S.years) {
    linesHTML = &#39;&lt;div class=&quot;note&quot; style=&quot;margin-bottom:12px;padding:10px 14px;font-size:14px;&quot;&gt;请先选择购买年限，再查看完整报价。&lt;/div&gt;&#39;;
  }
  const yearsTxt = S.years &gt; 1 ? &#39; ×&#39; + S.years + &#39;年&#39; : &#39;&#39;;
  const amtTxt = S.years &gt; 0 ? &#39;元&#39; : &#39;元/年&#39;;
  r.items.forEach(it =&gt; {
    linesHTML += &#39;&lt;div class=&quot;s-line&quot;&gt;&lt;span class=&quot;sl&quot;&gt;&#39; + it.label + &#39;&lt;br&gt;&lt;sm&gt;&#39; + it.calc + yearsTxt + &#39;&lt;/sm&gt;&lt;/span&gt;&#39; +
      &#39;&lt;span class=&quot;sv&quot;&gt;¥&#39; + fmt(S.years &gt; 0 ? it.amt * S.years : it.amt) + &#39; &lt;sm&gt;&#39; + amtTxt + &#39;&lt;/sm&gt;&lt;/span&gt;&lt;/div&gt;&#39;;
  });
  r.lingjiRows.forEach(it =&gt; {
    linesHTML += &#39;&lt;div class=&quot;s-line&quot;&gt;&lt;span class=&quot;sl&quot;&gt;&#39; + it.label + &#39;&lt;br&gt;&lt;sm&gt;&#39; + it.calc + &#39;&lt;/sm&gt;&lt;/span&gt;&#39; +
      &#39;&lt;span class=&quot;sv&quot;&gt;¥&#39; + fmt(it.amt) + &#39; &lt;sm&gt;元&lt;/sm&gt;&lt;/span&gt;&lt;/div&gt;&#39;;
  });
  el(&#39;s-lines&#39;).innerHTML = linesHTML || &#39;&lt;div class=&quot;s-line&quot;&gt;&lt;span class=&quot;sl&quot; style=&quot;color:var(--t3);&quot;&gt;未选择任何计费项目&lt;/span&gt;&lt;span class=&quot;sv&quot;&gt;—&lt;/span&gt;&lt;/div&gt;&#39;;

  // ---- 汇总数字 ----
  el(&#39;sum-users&#39;).textContent = S.users;
  el(&#39;sum-accts&#39;).textContent = S.accounts;
  el(&#39;sum-years&#39;).textContent = S.years || 0;

  if (S.years &gt; 0) {
    el(&#39;orig-price&#39;).textContent = fmt(r.orig);
    el(&#39;disc-price&#39;).textContent = fmt(r.disc);
  } else {
    el(&#39;orig-price&#39;).textContent = &#39;—&#39;;
    el(&#39;disc-price&#39;).textContent = &#39;—&#39;;
  }
  const hasLj = r.lingjiYr + r.lingjiPack &gt; 0;
  let totalLabel = &#39;最终价（租赁费&#39;;
  if (hasLj) totalLabel += &#39;+增值服务&#39;;
  if (S.jxc) totalLabel += &#39;+实施费&#39;;
  totalLabel += &#39;）&#39;;
  el(&#39;total-label&#39;).textContent = totalLabel;

  let saveInfo = &#39;&#39;;
  if (S.years &gt; 1 &amp;&amp; r.saved &gt; 0) {
    saveInfo = &#39;已享&#39; + S.years + &#39;年&#39; + r.dcText + &#39;优惠，节省 ¥&#39; + fmt(r.saved);
  }
  el(&#39;s-save&#39;).textContent = saveInfo;

  const lingjiSum = r.lingjiYr + r.lingjiPack;
  if (lingjiSum &gt; 0) {
    el(&#39;lingji-line&#39;).style.display = &#39;&#39;;
    el(&#39;lingji-price&#39;).textContent = fmt(lingjiSum);
  } else {
    el(&#39;lingji-line&#39;).style.display = &#39;none&#39;;
  }

  if (r.implFee &gt; 0) {
    el(&#39;impl-line&#39;).style.display = &#39;&#39;;
    el(&#39;impl-price&#39;).textContent = fmt(r.implFee);
  } else {
    el(&#39;impl-line&#39;).style.display = &#39;none&#39;;
  }

  el(&#39;all-price&#39;).textContent = S.years &gt; 0 ? fmt(r.all) : &#39;—&#39;;
  el(&#39;mbar-price&#39;).textContent = S.years &gt; 0 ? fmt(r.all) : &#39;—&#39;;
  el(&#39;mbar-label&#39;).textContent = totalLabel + (S.years &gt; 0 ? &#39;&#39; : &#39;（请先选年限）&#39;);
  // 模块联动：已选版本但未勾选任何模块时，锁定用户数 / 账套数 / 增值服务
  const anyMod = S.fin || S.jxc || S.prod;
  lockCard(el(&#39;user-card&#39;), !anyMod, el(&#39;user-desc&#39;), &#39;请先选择模块&#39;, &#39;基础含&#39; + DATA[S.ver].baseUsers + &#39;个用户，可按需增购&#39;);
  lockCard(el(&#39;acct-card&#39;), !anyMod, el(&#39;acct-desc&#39;), &#39;请先选择模块&#39;, &#39;基础含&#39; + DATA[S.ver].accounts + &#39;个账套，可按需增购&#39;);
  lockCard(el(&#39;addon-card&#39;), !anyMod, el(&#39;addon-desc&#39;), &#39;请先选择模块&#39;, &#39;金蝶灵基AI · 只能1年1年的购买&#39;);
  el(&#39;lingji-pack-row&#39;).style.opacity = anyMod ? &#39;1&#39; : &#39;0.5&#39;;
  el(&#39;lingji-pack-row&#39;).style.pointerEvents = anyMod ? &#39;auto&#39; : &#39;none&#39;;
}

function lockCard(card, locked, descEl, lockMsg, unlockMsg) {
  card.style.opacity = locked ? &#39;0.5&#39; : &#39;1&#39;;
  card.style.pointerEvents = locked ? &#39;none&#39; : &#39;auto&#39;;
  descEl.textContent = locked ? lockMsg : unlockMsg;
}

// ===================== 方案编号 =====================
function newPlanNo() {
  const now = new Date();
  const ymd = &#39;&#39; + now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate());
  const seq = lsGet(LS_KEY.seq, { d: &#39;&#39;, n: 0 });
  const n = seq.d === ymd ? seq.n + 1 : 1;
  lsSet(LS_KEY.seq, { d: ymd, n: n });
  return &#39;KDQG-&#39; + ymd + &#39;-&#39; + (&#39;000&#39; + n).slice(-3);
}
// 同一份配置重复导出/复制时复用方案编号，避免编号跳号
let lastSig = &#39;&#39;, lastNo = &#39;&#39;;
function stateSig() {
  return [S.ver, S.users, S.accounts, S.years,
    S.fin ? 1 : 0, S.jxc ? 1 : 0, S.prod ? 1 : 0,
    S.lingjiStd, S.lingjiStdYr, S.lingjiPro, S.lingjiProYr, S.lingjiPack].join(&#39;|&#39;);
}
function setPlanNo() {
  const sig = stateSig();
  if (sig === lastSig &amp;&amp; lastNo) {    return lastNo;
  }
  lastNo = newPlanNo();
  lastSig = sig;  return lastNo;
}

<script>
  var jbCur = 0;
  function jbSwitch(idx) {
    jbCur = idx;
    document.querySelectorAll('.jb-tab').forEach(function(t, i){ t.classList.toggle('active', i === idx); });
    document.querySelectorAll('.jb-frame').forEach(function(f, i){ f.classList.toggle('active', i === idx); });
    var ind = document.querySelector('.jb-indicator');
    if (ind) ind.style.transform = 'translateX(' + (idx * 100) + '%)';
    // 客户已看过区别后，停止呼吸提示，避免干扰
    var hint = document.querySelector('.jb-tab.hint');
    if (hint && idx === 2) hint.classList.remove('hint');
    // 每次切换回到内容顶部，避免看到上一个页签的滚动位置
    var fr = document.getElementById('jb-frame-' + idx);
    if (fr) {
      try { if (fr.contentWindow) fr.contentWindow.scrollTo(0, 0); } catch (e) {}
    }
    updateGuide();
  }
  // 顶部快捷按钮：在精斗云 / 星辰之间一键互切
  function jbSwitchOther() {
    jbSwitch(jbCur === 1 ? 0 : 1);
  }
  // 顶部按钮文案随当前页签变化；差异页不显示
  function updateGuide() {
    var btn = document.getElementById('jbGuide');
    if (!btn) return;
    var tx = btn.querySelector('.jb-guide-tx');
    if (tx) tx.textContent = jbCur === 1 ? '看精斗云' : '看星辰';
    btn.style.display = (jbCur === 2) ? 'none' : 'inline-flex';
  }
  jbSwitch(0); // 默认定位到金蝶精斗云页签

  // 暴露给各子页（报价弹窗里的「对比另一款」按钮调用）
  window.jbSwitchOther = jbSwitchOther;
  window.jbFrameSwitch = jbSwitch;
</script><!--pnid:XDTflpVxxd4XNGyjE4PzOG-->
