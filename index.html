<!DOCTYPE html>

<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金蝶精斗云 · 在线报价器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            font-size: 17px;
            line-height: 1.5;
        }

        .header {
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            color: #fff;
            padding: 24px 40px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header h1 { font-size: 34px; font-weight: 600; letter-spacing: 1px; }

        .container {
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 28px;
        }

        .panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .panel-header {
            padding: 18px 24px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-header .icon { font-size: 20px; }
        .panel-body { padding: 20px 24px; counter-reset: config-section; }

        /* 配置项 */
        .config-section { margin-bottom: 22px; }
        .config-section:last-child { margin-bottom: 0; }
        .config-label {
            font-size: 20px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 700;
            counter-increment: config-section;
        }
        .config-label::before {
            content: counter(config-section);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin-right: 10px;
            background: #1890ff;
            color: #fff;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            vertical-align: middle;
        }
        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .option-btn {
            padding: 11px 22px;
            border: 1.5px solid #d9d9d9;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 16px;
            color: #555;
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
        }
        .option-btn:hover { border-color: #1890ff; color: #1890ff; }
        .option-btn.active {
            background: #e6f7ff;
            border-color: #1890ff;
            color: #1890ff;
            font-weight: 500;
        }
        .option-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 16px 16px;
            border-color: transparent transparent #1890ff transparent;
        }
        /* 模块选择 */
        .module-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 14px 18px;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .module-item:hover { border-color: #bae7ff; }
        .module-item.selected {
            background: #e6f7ff;
            border-color: #1890ff;
        }
        .module-item::before {
            content: '';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            flex-shrink: 0;
            border: 1.5px solid #d9d9d9;
            border-radius: 4px;
            background: #fff;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            box-sizing: border-box;
        }
        .module-item.selected::before {
            content: '✓';
            background: #1890ff;
            border-color: #1890ff;
        }
        .module-item.disabled::before {
            background: #f5f5f5;
            border-color: #f0f0f0;
        }
        .module-info { display: flex; align-items: center; gap: 10px; }
        .module-name { font-size: 18px; font-weight: 500; }
        .module-desc { font-size: 14px; color: #999; margin-top: 3px; }
        .module-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
            margin-left: 10px;
        }
        .tag-add { background: #e6fffb; color: #13c2c2; border: 1px solid #87e8de; }

        .module-item.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #fafafa;
            border-style: dashed;
        }
        .module-item.disabled:hover { border-color: #e8e8e8; }
        .module-lock { font-size: 12px; color: #fa541c; margin-top: 4px; }

        /* 右侧面板 */
        .summary-panel { position: sticky; top: 20px; }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 1px dashed #f0f0f0;
            font-size: 18px;
        }
        .price-row:last-of-type { border-bottom: none; }
        .price-row .label { color: #666; }
        .price-row .value { font-weight: 500; color: #333; }
        .total-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 2px solid #f0f0f0;
        }
        .total-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .total-label { font-size: 19px; color: #666; }
        .total-original { font-size: 20px; color: #999; }
        .right-group { display: flex; align-items: baseline; gap: 8px; }
        .total-price {
            font-size: 48px;
            font-weight: 700;
            color: #f5222d;
        }
        .total-price .unit { font-size: 20px; font-weight: 600; }
        .save-note {
            font-size: 15px;
            color: #52c41a;
            text-align: right;
            margin-top: 8px;
            min-height: 18px;
            font-weight: 500;
        }

        .buy-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1890ff, #096dd9);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 21px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.25s ease;
            letter-spacing: 2px;
        }
        .buy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(24,144,255,0.35);
        }

        /* 底部说明 */
        .footer-note {
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 0 20px;
            text-align: center;
            font-size: 15px;
            color: #bbb;
            line-height: 1.9;
        }
        .footer-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px;
            background: #fff;
            border: 1px solid #eef0f3;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 6px;
        }
        .qr-img {
            width: 155px;
            height: 155px;
            display: block;
            border-radius: 6px;
        }
        .qr-tip {
            font-size: 15px;
            color: #1890ff;
            font-weight: 500;
            text-align: center;
        }

        /* 复制成功提示 toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            font-size: 16px;
            padding: 12px 24px;
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 移动端底部价格栏（默认隐藏，仅移动端且配置完成后显示） */
        .mobile-price-bar {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            background: #fff;
            border-top: 1px solid #e8e8e8;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
            padding: 10px 16px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            align-items: center;
            justify-content: space-between;
        }
        .mobile-price-bar .mp-left {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .mobile-price-bar .mp-label {
            font-size: 14px;
            color: #999;
        }
        .mobile-price-bar .mp-price {
            font-size: 26px;
            font-weight: 700;
            color: #1890ff;
            line-height: 1;
        }
        .mobile-price-bar .mp-orig {
            font-size: 13px;
            color: #bbb;
            text-decoration: line-through;
            margin-left: 4px;
            display: none;
        }
        .mobile-price-bar .mp-btn {
            display: inline-block;
            background: #1890ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            pointer-events: auto;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; gap: 20px; padding: 0 16px; margin: 20px auto; }
            .summary-panel { position: static; }
            .header { padding: 18px 20px; }
            .header h1 { font-size: 26px; }
            .config-label { font-size: 18px; }
            .option-btn { font-size: 15px; padding: 10px 18px; }
            .module-name { font-size: 17px; }
            .price-row { font-size: 16px; }
            .total-price { font-size: 38px; }
            .buy-btn { font-size: 19px; }
            /* 移动端：底部价格栏 */
            .mobile-price-bar.show { display: flex; }
            /* 底部栏不遮挡页脚内容 */
            body { padding-bottom: 70px; }
        }
    </style>
</head>

    <h1>金蝶精斗云 · 在线报价器</h1>

<div class="container">

                </div>
            </div>
            <span class="module-tag tag-add">可选</span>
        </div></div>
                </div>

            </div>
        </div>
    </div>

    <!-- 右侧价格汇总 -->
    <div class="summary-panel">
        <div class="panel">
            <div class="panel-header"><span class="icon">🧾</span> 产品规格</div>
            <div class="panel-body">
                <div class="price-row">
                    <span class="label">账套数：</span>
                    <span class="value" id="dispAccounts">3账套</span>
                </div>
                <div class="price-row">
                    <span class="label">用户数：</span>
                    <span class="value" id="dispUsers">2用户</span>
                </div>
                <div class="price-row">
                    <span class="label">使用年限：</span>
                    <span class="value" id="dispYears">3年</span>
                </div>
                <div class="price-row">
                    <span class="label">选择模块：</span>
                    <span class="value" id="dispModules">财务模块</span>
                </div>

                <div class="total-section">
                    <div class="total-row">
                        <span class="total-label">原价</span>
                        <span class="total-original">¥<span id="origPrice">3894</span></span>
                    </div>
                    <div class="total-row">
                        <span class="total-label">折后价</span>
                        <span class="right-group">
                            <span class="total-price"><span class="unit">¥</span><span id="finalPrice">3505</span></span>
                        </span>
                    </div>
                    <div class="save-note" id="saveNote">已享3年9折优惠，节省 ¥389</div>
                </div>

                <button class="buy-btn" onclick="copyQuote()">复制报价文本</button>
            </div>
        </div>
    </div>
</div>

<!-- 移动端底部价格栏 -->
<div class="mobile-price-bar show" id="mobilePriceBar">
    <div class="mp-left">
        <span class="mp-label">最终价</span>
        <span class="mp-price">¥<span id="mpPrice">3505</span></span>
        <span class="mp-orig" id="mpOrig" style="display: inline;">原价 ¥3894</span>
    </div>
    <button class="mp-btn" onclick="copyQuote()">复制报价</button>
</div>

<script>
// ========== 定价数据（官方价目表） ==========
const PRICING = {
    // 精确价格表：priceMatrix[账套数][用户数] = 年费（元/年，仅财务模块）
    priceMatrix: {
        '3':  { 1:798, 2:1298, 3:1698, 4:2098, 5:2498, 6:2880, 7:3280, 8:3680, 9:4080, 10:4480 },
        '10': { 1:998, 2:1498, 3:1898, 4:2298, 5:2698, 6:3080, 7:3480, 8:3880, 9:4280, 10:4680 },
        '20': { 1:1298, 2:1798, 3:2198, 4:2598, 5:2998, 6:3380, 7:3780, 8:4180, 9:4580, 10:4980 },
    },

    // 年限折扣
    yearDiscount: { 1: 1, 3: 0.90, 5: 0.80 },

    // 模块定义
    modules: [
        { id: 'accounting', name: '财务模块', desc: '总账，报表，固定资产，出纳，结账', tag: 'add', tagText: '可选', price: 0 },
        { id: 'tax', name: '智能取票', desc: '直连电子税局提取发票', tag: 'add', tagText: '可选', price: 0, pricePerAccount: 198 },
    ]
};

// ========== 状态（默认预填：3账套/1用户/1年，财务模块默认勾选） ==========
let state = {
    users: 1,
    years: 1,
    accounts: '3',
    selectedModules: ['accounting']   // 默认勾选财务模块
};

// ========== 初始化 ==========
function init() {
    renderUserOptions();
    renderYearOptions();
    renderAccountOptions();
    renderModules();
    updatePrice();
}

function renderUserOptions() {
    const container = document.getElementById('userOptions');
    container.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (i === state.users ? ' active' : '');
        btn.textContent = i + '用户';
        btn.onclick = () => selectOption('users', i, container, btn);
        container.appendChild(btn);
    }
}

function renderYearOptions() {
    const container = document.getElementById('yearOptions');
    container.innerHTML = '';
    // 可选年限：1年(无折扣)、3年(9折/省10%)、5年(8折/省20%)
    const yearList = [1, 3, 5];
    yearList.forEach(y => {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (y === state.years ? ' active' : '');
        let label = y + '年';
        const disc = PRICING.yearDiscount[y];
        if (disc < 1) {
            // 统一使用全角括号，与「1年（无折扣）」保持一致
            label += '（' + Math.round(disc * 10) + '折·省' + Math.round((1 - disc) * 100) + '%）';
        } else {
            label += '（无折扣）';
        }
        btn.textContent = label;
        btn.onclick = () => selectOption('years', y, container, btn);
        container.appendChild(btn);
    });
}

function renderAccountOptions() {
    const container = document.getElementById('accountOptions');
    container.innerHTML = '';
    ['3', '10', '20'].forEach(acc => {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (acc === state.accounts ? ' active' : '');
        btn.textContent = acc + '账套';
        btn.onclick = () => selectOption('accounts', acc, container, btn);
        container.appendChild(btn);
    });
}

function renderModules() {
    const container = document.getElementById('moduleList');
    container.innerHTML = '';
    PRICING.modules.forEach(mod => {
        const isSelected = state.selectedModules.includes(mod.id);
        // 智能取票依赖财务模块：财务模块未勾选时禁用，不可单独选择
        const locked = (mod.id === 'tax' && !state.selectedModules.includes('accounting'));
        const item = document.createElement('div');
        item.className = 'module-item' + (isSelected ? ' selected' : '') + (locked ? ' disabled' : '');

        const tagClass = 'tag-' + mod.tag;
        const lockHint = locked ? '<div class="module-lock">⚠️ 需先勾选财务模块</div>' : '';

        item.innerHTML = `
            <div class="module-info">
                <div>
                    <div class="module-name">${mod.name}</div>
                    <div class="module-desc">${mod.desc}</div>
                    ${lockHint}
                </div>
            </div>
            ${mod.id !== 'accounting' ? `<span class="module-tag ${tagClass}">${mod.tagText}</span>` : ''}
        `;
        item.onclick = locked ? null : () => toggleModule(mod.id);
        container.appendChild(item);
    });
}

function selectOption(key, value, container, btn) {
    // 点击已选中的项 → 取消选择（回到未选状态，触发清零）
    if (state[key] === value) {
        state[key] = null;
        container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    } else {
        state[key] = value;
        container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    updatePrice();
}

function toggleModule(modId) {
    const mod = PRICING.modules.find(m => m.id === modId);

    const idx = state.selectedModules.indexOf(modId);
    if (idx >= 0) {
        state.selectedModules.splice(idx, 1);
        // 取消财务模块时，自动取消依赖它的智能取票
        if (modId === 'accounting') {
            const taxIdx = state.selectedModules.indexOf('tax');
            if (taxIdx >= 0) state.selectedModules.splice(taxIdx, 1);
        }
    } else {
        // 智能取票依赖财务模块，未勾选财务模块时禁止选择
        if (mod.id === 'tax' && !state.selectedModules.includes('accounting')) return;
        state.selectedModules.push(modId);
    }
    renderModules();
    updatePrice();
}

// ========== 价格计算 ==========
function calculatePrice() {
    // 完整性校验：账套数 / 用户数 / 使用年限 / 模块 任一未选 → 价格清零
    const incomplete = !state.accounts || !state.users || !state.years || state.selectedModules.length === 0;
    if (incomplete) {
        return { base: 0, listPrice: 0, originalTotal: 0, finalTotal: 0, discount: 1, incomplete: true };
    }

    // 1. 取上传价目表的官方价（财务模块年费）
    const listPrice = PRICING.priceMatrix[state.accounts][state.users];

    // 2. 模块加价（智能取票：198元/账套/年）
    let moduleTotal = 0;
    PRICING.modules.forEach(mod => {
        if (state.selectedModules.includes(mod.id)) {
            if (mod.pricePerAccount) {
                moduleTotal += mod.pricePerAccount * parseInt(state.accounts, 10);
            } else {
                moduleTotal += mod.price || 0;
            }
        }
    });

    // 3. 年费小计 = 官方价 + 模块年费
    const annualFee = listPrice + moduleTotal;

    // 4. 原价 = (官方价 + 模块) × 年数（含模块的总原价）
    const originalTotal = annualFee * state.years;

    // 5. 折后价 = 原价 × 年限折扣（恒 ≤ 原价）
    const discount = PRICING.yearDiscount[state.years];
    const finalTotal = Math.round(originalTotal * discount);

    return { base: annualFee, listPrice, originalTotal, finalTotal, discount };
}

function updatePrice() {
    const result = calculatePrice();

    // 更新显示（未选维度显示「请选择」）
    document.getElementById('dispAccounts').textContent = state.accounts ? state.accounts + '账套' : '请选择';
    document.getElementById('dispUsers').textContent = state.users ? state.users + '用户' : '请选择';
    document.getElementById('dispYears').textContent = state.years ? state.years + '年' : '请选择';

    const modNames = state.selectedModules.map(id =>
        PRICING.modules.find(m => m.id === id).name
    );
    document.getElementById('dispModules').textContent = modNames.length ? modNames.join(' + ') : '请选择';

    document.getElementById('finalPrice').textContent = result.finalTotal;
    document.getElementById('origPrice').textContent = result.originalTotal;

    // 移动端底部价格栏：配置完整且价格 > 0 时才显示
    const mpBar = document.getElementById('mobilePriceBar');
    if (!result.incomplete && result.finalTotal > 0) {
        document.getElementById('mpPrice').textContent = result.finalTotal;
        // 有折扣时显示划线原价
        const mpOrig = document.getElementById('mpOrig');
        if (result.discount < 1 && result.originalTotal !== result.finalTotal) {
            mpOrig.textContent = '原价 ¥' + result.originalTotal;
            mpOrig.style.display = 'inline';
        } else {
            mpOrig.style.display = 'none';
        }
        mpBar.classList.add('show');
    } else {
        mpBar.classList.remove('show');
    }

    // 折后价下方的「已享N年M折，节省¥XXX」备注（仅折扣时显示）
    const saveEl = document.getElementById('saveNote');
    if (!result.incomplete && result.discount < 1) {
        const saved = result.originalTotal - result.finalTotal;
        saveEl.textContent = `已享${state.years}年${Math.round(result.discount * 10)}折优惠，节省 ¥${saved}`;
    } else {
        saveEl.textContent = '';
    }

}

function copyQuote() {
    const result = calculatePrice();
    // 未选齐则不生成报价
    if (result.incomplete) {
        showToast('⚠️ 请先完成全部配置（账套数、用户数、使用年限、模块）');
        return;
    }
    const modNames = state.selectedModules.map(id => PRICING.modules.find(m => m.id === id).name).join('、');

    // 统一使用全角括号
    const yearLabel = state.years === 1 ? '1年（无折扣）' : state.years + '年（' + Math.round(result.discount * 10) + '折·省' + Math.round((1 - result.discount) * 100) + '%）';
    const discountNote = result.discount < 1 ? '（原价 ¥' + result.originalTotal + '）' : '';

    const text =
        '📋 金蝶精斗云报价单\n' +
        '━━━━━━━━━━━━━━━━━\n' +
        '账套数：' + state.accounts + ' 账套\n' +
        '用户数：' + state.users + ' 用户\n' +
        '使用年限：' + yearLabel + '\n' +
        '服务模块：' + modNames + '\n' +
        '━━━━━━━━━━━━━━━━━\n' +
        '合计价格：¥' + result.finalTotal + discountNote + '\n\n' +
        '本报价器仅供参考，最终价格以金蝶强哥实际报价为准\n' +
        '购买咨询强哥 18221094656';

    // 优先使用 Clipboard API，降级到 textarea + execCommand
    const doCopy = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    };

    const success = () => showToast('报价文本已复制到剪贴板');

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(success, () => { doCopy(); success(); });
    } else {
        doCopy();
        success();
    }
}

// 轻量提示：显示 3 秒后自动淡出关闭
let toastTimer = null;
function showToast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
    }
    el.textContent = msg;
    // 触发进入动画
    requestAnimationFrame(() => el.classList.add('show'));
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        el.classList.remove('show');
    }, 3000);
}

// 启动
init();
